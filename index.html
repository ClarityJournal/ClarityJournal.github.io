<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Clarity · Trading Journal</title>
<style>
:root{--bg:#0b0d10;--bg2:#0f1216;--card:#14171b;--card2:#1b1f24;--text:#e8eaed;--muted:#8a9099;--faint:#5d636b;--accent:#3cc4b4;--btn:#2b9e92;--btntext:#fff;--line:rgba(255,255,255,.06);--glow:rgba(60,196,180,.20);--beam:#3cc4b4}
@media (prefers-color-scheme: light){:root{--bg:#f4f1ee;--bg2:#efebe7;--card:#ffffff;--card2:#ebe6e1;--text:#1c2125;--muted:#6b7177;--faint:#9aa0a6;--accent:#1f8f83;--btn:#1f8f83;--btntext:#fff;--line:rgba(0,0,0,.07);--glow:rgba(31,143,131,.14);--beam:#1f8f83}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
nav{position:sticky;top:0;z-index:5;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--bg) 80%,transparent);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-size:18px;font-weight:300;letter-spacing:8px}
.navlinks{display:flex;gap:28px;align-items:center;font-size:14px;color:var(--muted)}
.navlinks a:hover{color:var(--text)}
.pillbtn{padding:9px 18px;border-radius:999px;background:var(--btn);color:var(--btntext)!important;font-weight:500}
.eb{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent)}
.btn{display:inline-flex;flex-direction:column;justify-content:center;min-width:230px;padding:15px 22px;border-radius:12px;background:var(--btn);color:var(--btntext);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 30px var(--glow)}
.btn.alt{background:var(--card2);color:var(--text)}
.btn b{font-size:16px;font-weight:600}.btn span{font-size:12px;opacity:.75;margin-top:3px}
.btns{display:flex;flex-wrap:wrap;gap:14px}
.ver{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:6px 14px;border-radius:999px;background:var(--card)}
.ver i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.card{background:var(--card);border-radius:16px;padding:28px 30px}
.notes{white-space:pre-line;font-size:15px;line-height:1.65;margin-top:12px}
.beam{height:2px;background:linear-gradient(90deg,transparent,var(--beam),transparent);box-shadow:0 0 24px var(--beam);opacity:.8}
footer{border-top:1px solid var(--line);margin-top:96px}
footer .wrap{display:flex;justify-content:space-between;height:72px;align-items:center;font-size:12px;color:var(--faint)}
.glowbg{position:absolute;inset:0;pointer-events:none;background:radial-gradient(50% 60% at 15% 10%,var(--glow),transparent 70%)}
.hero{position:relative}
h1{font-weight:300;letter-spacing:-.5px;margin:0}
.lead{color:var(--muted);font-size:18px;line-height:1.6;margin:0}
/* Seite */
.v2 .hero .wrap{text-align:center;padding-top:120px}
.v2 h1{font-size:64px;line-height:1.05;margin:22px auto 36px;max-width:820px}
.v2 .lead{max-width:560px;margin:0 auto 36px}
.v2 .btns{justify-content:center}
.v2 .beamwrap{margin:84px auto 0;max-width:900px}
.v2 .notesec{max-width:760px;margin:56px auto 0}
.v2 .glowbg{background:radial-gradient(45% 55% at 50% 0%,var(--glow),transparent 70%)}
@media (max-width:860px){.v2 h1{font-size:40px}.navlinks a:not(.pillbtn){display:none}}
</style>
</head>
<body>
<nav><div class="wrap"><div class="logo">CLARITY</div></div></nav>
<div id="root"></div>
<footer><div class="wrap"><span>Clarity · Trading Journal</span><span id="fver"></span></div></footer>
<script>
const OWNER="ClarityJournal",REPO="ClarityJournal.github.io";
const base=`https://github.com/${OWNER}/${REPO}/releases/latest/download/`;
const V='2';
const btns=`<div class="btns" id="download"><a class="btn" href="${base}Clarity-Setup.exe"><b>Für Windows laden</b><span>Windows 10 / 11</span></a><a class="btn alt" href="${base}Clarity-mac.zip"><b>Für Mac laden</b><span>Mac mit Apple-Chip</span></a></div>`;
const ver=`<span class="ver"><i></i><span class="vtxt">Neueste Version</span></span>`;
const notes=`<div class="card" id="neu"><div class="eb">Was ist neu</div><div class="notes" id="notes">Die Änderungen stehen bei jeder neuen Version hier.</div></div>`;
const T={
'2':`<div class="v2"><section class="hero"><div class="glowbg"></div><div class="wrap">${ver}<h1>Download</h1>${btns}<div class="beamwrap beam"></div><div class="notesec" style="text-align:left">${notes}</div></div></section></div>`};
document.getElementById('root').innerHTML=T[V]||T['2'];
function show(rel){const v=(rel.tag_name||'').replace(/^v/i,'');const d=rel.published_at?new Date(rel.published_at).toLocaleDateString('de-DE'):'';
 document.querySelectorAll('.vtxt').forEach(e=>e.textContent=V==='3'?'Clarity '+v:'Version '+v+(d?' · '+d:''));const vd=document.getElementById('vdate');if(vd)vd.textContent=d;
 document.getElementById('fver').textContent='Version '+v;if(rel.body)document.getElementById('notes').textContent=rel.body.trim()}
fetch(`https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`).then(r=>r.ok?r.json():null).then(r=>r&&show(r)).catch(()=>{});
</script>
</body></html>
